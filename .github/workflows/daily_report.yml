name: Daily Market Report Collector

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 書き込み権限を明示的に許可
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # バージョンを更新

    - name: Set up Python
      uses: actions/setup-python@v5 # バージョンを更新
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas beautifulsoup4 lxml tabulate

    - name: Run collector script
      run: python trader_info_collector.py

    - name: Commit and push report
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add daily_report_*.md
        # 変更がある場合のみコミット
        if ! git diff --cached --quiet; then
          git commit -m "Add daily market report $(date +'%Y-%m-%d')"
          git push
        else
          echo "No changes to commit"
        fi
