name: Daily Market Report Collector (GitHub AI)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      # GitHub Modelsへのアクセスに必要
      models: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas beautifulsoup4 lxml tabulate azure-ai-inference azure-core

    - name: Run collector script
      env:
        # GitHub Actionsに標準搭載されているトークンを使用
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python trader_info_collector.py

    - name: Commit and push report
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add daily_report_*.md
        if ! git diff --cached --quiet; then
          git commit -m "Add daily market report $(date +'%Y-%m-%d')"
          git push
        else
          echo "No changes to commit"
        fi
