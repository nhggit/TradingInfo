name: Daily Market Report Collector (GitHub AI + Email)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      models: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas beautifulsoup4 lxml tabulate azure-ai-inference azure-core

    - name: Run collector script
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python trader_info_collector.py

    - name: Commit and push report
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add daily_report_*.md
        if ! git diff --cached --quiet; then
          git commit -m "Add daily market report $(date +'%Y-%m-%d')"
          git push
        else
          echo "No changes to commit"
        fi

    - name: Send email with report
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: 'Daily Market Report - ${{ github.event.repository.name }}'
        body: '本日分のデイリーマーケットレポートを添付します。ご確認ください。'
        to: ${{ secrets.MAIL_RECIPIENT }}
        from: ${{ secrets.MAIL_USERNAME }}
        attachments: daily_report_*.md
        secure: true
