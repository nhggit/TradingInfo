name: Daily Market Report Collector

on:
  schedule:
    # 毎日日本時間の午前9時 (UTC 0:00) に実行
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行も可能にする

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas beautifulsoup4 lxml tabulate

    - name: Run collector script
      run: python trader_info_collector.py

    - name: Commit and push report
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add daily_report_*.md
        git commit -m "Add daily market report $(date +'%Y-%m-%d')" || exit 0
        git push
